<style>
  header.site-header { position: sticky; top: 0; z-index: 50; background: #ece6da; }
  html { scroll-padding-top: 100px; }
  .home-page .hero { min-height: 0; padding: 2.5rem 1.5rem 2rem; }
  .home-page .hero__identity { width: 100%; }
  .home-page .hero__wordmark { width: min(320px, 70vw); height: auto; max-height: none; margin-inline: auto; }
  .home-page .hero__deck { margin-top: 1rem; font-size: clamp(1rem, 1.4vw, 1.15rem); }
  @media (max-width: 760px) {
    .home-page .hero { min-height: 0; padding: 1.75rem 1.5rem; }
    .home-page .hero__wordmark { width: min(240px, 65vw); }
    header.site-header { max-height: 100dvh; overflow-y: auto; }
  }

  .site-header .menu-button { color: var(--ink, #171713); -webkit-appearance: none; appearance: none; }
  .site-header .menu-button:focus-visible { outline: 2px solid var(--terracotta, #985b43); outline-offset: 4px; }
  @media (max-width: 760px) {
    .site-header { flex-wrap: wrap; }
    .site-header .menu-button { display: inline-flex; align-items: center; gap: .6rem; min-height: 44px; padding: .5rem 0 .5rem .75rem; cursor: pointer; }
    .site-header .site-nav { position: static; flex: 0 0 100%; width: 100%; padding: 1rem 0 .25rem; border-bottom: 0; background: transparent; gap: 0; }
    .site-header .site-nav.is-open { display: flex; }
    .site-header .site-nav a { display: flex; align-items: center; min-height: 44px; padding: .75rem 0; }
  }

  /* A continuous paper background and quieter homepage introduction. */
  .home-page .hero { background: var(--paper, #f5f1e8); border-bottom: 0; min-height: 0; padding: 2rem 1.5rem 1.25rem; }
  .home-page .hero__wordmark { width: min(270px, 62vw); mix-blend-mode: multiply; }
  .home-page .hero__deck { margin-top: .85rem; font-size: clamp(.95rem, 1.3vw, 1.08rem); }
  body.home-page .empty-state { min-height: 0; padding: 1.5rem 0 0; }
  .home-page .empty-state > .eyebrow { margin: 0 0 .7rem; font-size: .65rem; letter-spacing: .16em; }
  .home-page .empty-state > h1 { max-width: 620px; margin: 0 auto .75rem; padding-inline: 1rem; font-size: clamp(1.85rem, 3.2vw, 2.6rem); line-height: 1.25; font-weight: 400; }
  .home-page .empty-state > p:last-of-type { max-width: 590px; padding-inline: 1rem; margin: 0 auto; font-size: 1rem; line-height: 1.55; }
  .home-page .empty-state .explore-section { margin-top: 2rem; padding-top: 2.5rem; }
  @media (max-width: 760px) {
    .home-page .hero { padding: 1.5rem 1.5rem 1rem; }
    .home-page .hero__wordmark { width: min(220px, 60vw); }
    body.home-page .empty-state { padding-top: 1.25rem; }
  }

  .home-page .hero::after { content: ""; display: block; width: 64px; height: 1px; background: var(--line, #cfc7b8); margin: 1.5rem auto 0; }
</style>
<header class="site-header">
  <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Mnemosyne home">
    <img src="{{ '/assets/images/mnemosyne-mark.png' | relative_url }}" alt="">
  </a>
  <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-navigation"><span>Menu</span><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path d="M2 4h14M2 9h14M2 14h14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
  <nav id="site-navigation" class="site-nav" aria-label="Primary navigation">
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/articles/' | relative_url }}">Articles</a>
    <a href="{{ '/about/' | relative_url }}">About</a>
    {% if site.instagram_url != "" %}<a href="{{ site.instagram_url }}" rel="me">Instagram</a>{% endif %}
  </nav>
</header>
