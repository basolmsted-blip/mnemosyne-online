{% if include.id == 'video' %}
<figure class="danse-figure film"><video muted loop playsinline preload="none" poster="/assets/articles/danse-macabre/skeleton-dance-poster.jpg" aria-label="Silent excerpt of The Skeleton Dance, 1929"><source data-src="/assets/articles/danse-macabre/skeleton-dance-compact.mp4" type="video/mp4"></video><button type="button" data-film-toggle>Play silent film</button><figcaption><div class="caption-copy"><strong>The Skeleton Dance · When the Dead Took the Stage</strong><p>An excerpt from Walt Disney’s The Skeleton Dance (1929), the first of the Silly Symphonies. Animated principally by Ub Iwerks, the short transforms a moonlit cemetery into a stage for dancing skeletons, combining macabre imagery with slapstick comedy. The film belongs to a much longer history of imagining the dead in motion.</p></div><div class="caption-tools"><details><summary>Film credit</summary><p>Walt Disney Productions, 1929. Directed by Walt Disney; animation principally by Ub Iwerks; music by Carl Stalling. Source: 16 mm film print digitized by GumdroplandFilms, via Wikimedia Commons. Public-domain film in the United States. Silent excerpt, 03:00–04:30.</p><a href="https://commons.wikimedia.org/wiki/File:The_Skeleton_Dance_(1929,_16MM_Film_Print).webm">Original film</a></details></div></figcaption></figure>

{% assign f = site.data.danse_figures[include.id] %}
<figure class="danse-figure{% if include.id == '8' or include.id == '11' %} danse-panorama{% endif %}" id="figure-{{ include.id }}" data-museum-figure {% if include.id == '8' %}data-fresco{% endif %}>
