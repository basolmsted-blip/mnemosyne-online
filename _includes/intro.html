{% if page.title == 'Home' %}
<style>
.mn-intro{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#fff;color:#000;overflow:hidden;transition:opacity .5s ease;isolation:isolate}
.mn-intro[hidden]{display:none}.mn-intro.closing{opacity:0;pointer-events:none}
.mn-stage{position:relative;width:min(82vw,760px);aspect-ratio:890 / 450;}
.mn-mark{position:absolute;z-index:2;height:100%;width:26.4045%;left:36.79775%;top:0;overflow:visible;animation:mn-join 1s cubic-bezier(.4,0,.2,1) 1.9s both}
.mn-trowel{animation:mn-drop 1.4s cubic-bezier(.22,.68,.25,1) .15s both}
.mn-words{position:absolute;z-index:1;inset:0;width:100%;height:100%}
.mn-title-reveal{animation:mn-emerge 1s cubic-bezier(.4,0,.2,1) 1.9s both}
.mn-reveal-edge{animation:mn-edge 1s cubic-bezier(.4,0,.2,1) 1.9s both}

@keyframes mn-edge{from{transform:translateX(327.5px)}to{transform:translateX(0)}}
@keyframes mn-emerge{from{transform:translateX(-327.5px)}to{transform:translateX(6px)}}
.mn-welcome-reveal{opacity:0;animation:mn-fade 2.2s ease-in-out 2.9s forwards}
@keyframes mn-fade{from{opacity:0}to{opacity:1}}
.mn-whole{opacity:0;animation:mn-solid .001s step-end 1.55s forwards}
.mn-split{animation:mn-hide .001s step-end 1.55s forwards}
@keyframes mn-solid{to{opacity:1}}@keyframes mn-hide{to{opacity:0}}
.mn-skip{position:absolute;right:max(1.5rem,env(safe-area-inset-right));bottom:max(1.5rem,env(safe-area-inset-bottom));background:none;color:#333;border:0;border-bottom:1px solid;padding:.4rem 0;cursor:pointer;font:500 12px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}
@keyframes mn-drop{from{transform:translateY(-620px);opacity:0}15%{opacity:1}to{transform:translateY(0);opacity:1}}
@keyframes mn-join{from{left:36.79775%}to{left:0}}
@keyframes mn-reveal{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){.mn-mark,.mn-trowel,.mn-words,.mn-whole,.mn-split,.mn-title-reveal,.mn-welcome-reveal,.mn-reveal-edge{animation:none}.mn-title-reveal{transform:translateX(6px)}.mn-title-reveal,.mn-welcome-reveal{opacity:1}.mn-whole{opacity:1}.mn-split{opacity:0}.mn-mark{left:0}.mn-words{opacity:1}}
</style>
