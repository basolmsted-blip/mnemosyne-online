{% assign f = site.data.kerma_figures[include.id] %}
<figure class="museum-figure museum-figure--{{ f.effect }}" id="figure-{{ include.id }}" data-museum-figure data-effect="{{ f.effect }}">
 <div class="museum-figure__track"><div class="museum-figure__sticky"><div class="museum-figure__canvas">{% if f.reverse %}<div class="museum-turn" aria-label="Two photographed faces of the same object"><div class="museum-turn__photo museum-turn__front"><img class="museum-figure__image" src="/assets/articles/kerma-blue/{{ f.image }}" data-original="/assets/articles/kerma-blue/{{ f.original }}" alt="{{ f.alt }}" width="{{ f.width }}" height="{{ f.height }}" loading="lazy" decoding="async"></div><div class="museum-turn__photo museum-turn__back"><img class="museum-turn-back" src="/assets/articles/kerma-blue/{{ f.reverse }}" data-original="/assets/articles/kerma-blue/{{ f.reverse_original }}" alt="{{ f.reverse_alt }}" width="{{ f.width }}" height="{{ f.height }}" loading="lazy" decoding="async"></div></div><div class="museum-turn__controls"><span class="museum-turn__side" aria-live="polite">Side A</span><div role="group" aria-label="Select photographed side"><button type="button" data-side-select="a" aria-pressed="true">Side A</button><button type="button" data-side-select="b" aria-pressed="false">Side B</button></div></div>{% else %}<img class="museum-figure__image" src="/assets/articles/kerma-blue/{{ f.image }}" data-original="/assets/articles/kerma-blue/{{ f.original }}" alt="{{ f.alt }}" width="{{ f.width }}" height="{{ f.height }}" loading="lazy" decoding="async">{% endif %}</div></div></div>
 <figcaption class="museum-figure__caption"><div><p class="museum-figure__name"><strong>Figure {{ f.number }} · {{ f.title }}</strong></p><p>{{ f.caption }}</p>{% if f.note %}<p class="museum-figure__note">{{ f.note }}</p>{% endif %}</div><div class="museum-figure__tools"><button type="button" data-examine>⌕ <span>Examine image</span></button><button type="button" data-image-credit>ⓘ <span>Image credit</span></button></div></figcaption>
 <dialog class="museum-credit" aria-label="Figure {{ f.number }} image credit"><button type="button" data-credit-close>Close ×</button><h2>Figure {{ f.number }} · {{ f.title }}</h2><p>{{ f.credit }}</p><p><a href="{{ f.source }}" target="_blank" rel="noopener">{{ f.source_label | default: "Original source" }}</a>{% if f.license %} · <a href="{{ f.license }}" target="_blank" rel="noopener">License</a>{% endif %}</p></dialog>
</figure>
