{% assign entry=site.data.holbein %}
<section class="multi-object" id="investigation" data-multi-object>
 <div class="artwork-navigation"><button type="button" data-art-prev>← Previous artwork</button><p data-art-status aria-live="polite"></p><button type="button" data-art-next>Next artwork →</button></div><div class="artwork-selector" role="group" aria-label="Choose artwork">{% for object in entry.objects %}<button type="button" data-art-select="{{ forloop.index0 }}">0{{ forloop.index }} · {{ object.title }}</button>{% endfor %}</div>
 <div class="multi-object-layout"><div class="object-evidence"><div class="object-zoom-controls"><button type="button" data-art-zoom-out aria-label="Zoom out">−</button><button type="button" data-art-reset>Reset image zoom</button><output data-art-zoom>100%</output><button type="button" data-art-zoom-in aria-label="Zoom in">+</button></div><div class="multi-object-viewport" tabindex="0" aria-label="Selected woodcut; use arrow keys to pan"><div class="multi-object-canvas"><img data-art-image src="{{ entry.objects[0].image }}" alt="{{ entry.objects[0].alt }}" draggable="false"><div data-hotspots></div></div></div><p class="object-short-credit" data-art-credit></p><a data-art-source target="_blank" rel="noopener">Museum record →</a></div><div class="object-detail-panel" tabindex="-1"><p class="eyebrow" data-detail-count></p><h2 data-detail-title></h2><div data-detail-intro></div><div class="detail-reveal"><div data-detail-reveal></div></div><div class="detail-selector" hidden></div><div class="feature-actions"><button type="button" data-detail-prev>← Previous detail</button><button type="button" data-detail-next>Next detail →</button><button type="button" data-whole>View whole artwork</button></div><section class="object-interpretation"><h3 data-conclusion-title></h3><div data-conclusion></div></section><button type="button" data-continue>Continue to the next encounter →</button></div></div>
</section>
<script type="application/json" id="multi-object-data">{{ entry | jsonify }}</script>
