{% assign object_posts = site.posts | where: "article_type", "object-in-focus" %}
<header class="site-header" data-site-header>
  <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Mnemosyne home">
    <img src="{{ '/assets/images/mnemosyne-mark.png' | relative_url }}" alt="" width="30" height="48">
    <span class="site-brand__text"><strong>Mnemosyne</strong><small>Archaeology of Memory</small></span>
  </a>
  <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-navigation">
    <span>Menu</span>
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path d="M2 4h14M2 9h14M2 14h14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
  <nav id="site-navigation" class="site-nav" aria-label="Primary navigation">
    <a href="{{ '/articles/' | relative_url }}">Stories</a>
    {% if object_posts.size > 0 %}<a href="{{ '/#objects-in-focus' | relative_url }}">Objects</a>{% else %}<a href="{{ '/articles/' | relative_url }}">Objects</a>{% endif %}
    <a href="{{ '/#explore' | relative_url }}">Explore</a>
    <a href="{{ '/about/' | relative_url }}">About</a>
  </nav>
</header>
