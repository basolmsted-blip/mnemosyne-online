<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f1e8">
    {% include seo.html %}
    <link rel="icon" href="{{ '/assets/images/mnemosyne-favicon-v3.png' | relative_url }}" type="image/png">
    <link rel="alternate" type="application/atom+xml" title="{{ site.name }}" href="{{ '/feed.xml' | absolute_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    {% if page.title == 'Home' %}
    <link rel="preload" as="image" href="{{ '/assets/images/articles/banana/banana-hero-image.jpg' | relative_url }}">
    {% endif %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=27">
  </head>
  <body{% if page.title == 'Home' %} class="home-page"{% endif %}>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include intro.html %}
    {% include header.html %}
    {{ content }}
    {% include footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}?v=4" defer></script>
  </body>
</html>
