<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .mark { fill: #171717; }
    @media (prefers-color-scheme: dark) { .mark { fill: #fff; } }
  </style>
  <mask id="silhouette" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
    <image width="64" height="64" href="data:image/png;base64,"/>
  </mask>
  <rect class="mark" width="64" height="64" mask="url(#silhouette)"/>
</svg>
