title: Mnemosyne
description: Archaeology, material culture, and the human past.
url: "https://mnemosynearchaeology.org"
baseurl: ""
author: Sebastian Olmsted
instagram_url: ""
permalink: /articles/:title/
future: false
markdown: kramdown

collections:
  posts:
    output: true
  objects_in_focus:
    output: true
    permalink: /objects-in-focus/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
  - scope:
      path: ""
      type: objects_in_focus
    values:
      layout: object-focus

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
